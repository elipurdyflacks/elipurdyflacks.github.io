<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eli Purdy-Flacks</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .logo {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1; pointer-events: none;
    }
    .drag {
      pointer-events: auto;
      perspective: 1200px;
      cursor: grab;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      will-change: transform;
    }
    .drag.dragging { cursor: grabbing; }
    .logo-stack {
      position: relative;
      width: min(56vw, 630px);
      aspect-ratio: 1770 / 1100;
      transform-style: preserve-3d;
      animation: spin 20s linear infinite;
    }
    @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

    /* two faces back to back so the text always reads forwards */
    .face {
      position: absolute; inset: 0;
      opacity: 0.6;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .face.back { transform: rotateY(180deg); }
    .face img { position: absolute; display: block; pointer-events: none; }
    .face .art { inset: 0; width: 100%; height: 100%; }
    /* glow is a pre-drawn image (much lighter for phones than a live CSS glow) */
    .face .glow {
      left: -12.994%; top: -20.909%;
      width: 125.988%; height: 141.818%;
      animation: glow 3s ease-in-out infinite alternate;
    }
    @keyframes glow { from { opacity: 0.75; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .logo-stack, .face .glow { animation: none !important; }
    }
    .cv-button, .music-button {
      position: fixed; bottom: 24px; z-index: 2;
      font-family: "Times New Roman", Times, serif;
      font-size: 26px; letter-spacing: 2px; line-height: 1;
      display: inline-block;
      transform: scaleY(2.3);           /* tall, narrow letters like the logo */
      transform-origin: left bottom;
      color: #000; text-decoration: none;
      padding: 2px 10px;
      opacity: 0.6;
      text-shadow: 0 0 8px rgba(255, 225, 150, 0.8), 0 0 20px rgba(255, 190, 90, 0.7);
      transition: opacity 0.2s;
    }
    .cv-button:hover, .music-button:hover { opacity: 1; }
    .cv-button { left: 24px; }
    .music-button { right: 24px; transform-origin: right bottom; }
  </style>
</head>
<body>
  <video id="bg" autoplay loop muted playsinline>
    <source src="background-mobile.mp4" type="video/mp4" media="(max-width: 900px)">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="logo">
    <div class="drag" id="drag">
      <div class="logo-stack">
        <div class="face front">
          <img class="glow" src="logo-glow.png" alt="" draggable="false">
          <img class="art" src="logo-test.png" alt="Eli Purdy-Flacks" draggable="false">
        </div>
        <div class="face back">
          <img class="glow" src="logo-glow.png" alt="" draggable="false">
          <img class="art" src="logo-test.png" alt="" draggable="false">
        </div>
      </div>
    </div>
  </div>
  <a class="cv-button" href="cv.html">CV</a>
  <a class="music-button" href="https://linktr.ee/purdyflacks" target="_blank" rel="noopener">MUSIC</a>
  <script>
    document.getElementById('bg').play().catch(function () {});

    // drag the logo around
    (function () {
      var el = document.getElementById('drag');
      var x = 0, y = 0, startX, startY, baseX, baseY, queued = false;
      function render() {
        queued = false;
        el.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0)';
      }
      el.addEventListener('pointerdown', function (e) {
        el.setPointerCapture(e.pointerId);
        el.classList.add('dragging');
        startX = e.clientX; startY = e.clientY; baseX = x; baseY = y;
      });
      el.addEventListener('pointermove', function (e) {
        if (!el.classList.contains('dragging')) return;
        x = baseX + e.clientX - startX;
        y = baseY + e.clientY - startY;
        if (!queued) { queued = true; requestAnimationFrame(render); }
      });
      function stop() { el.classList.remove('dragging'); }
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
    })();
  </script>
</body>
</html>
