<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eli Purdy-Flacks</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .logo {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1; pointer-events: none;
    }
    .drag {
      pointer-events: auto;
      perspective: 1200px;
      cursor: grab;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    .drag.dragging { cursor: grabbing; }
    .logo-stack {
      position: relative;
      width: min(56vw, 630px);
      transform-style: preserve-3d;
      animation: spin 20s linear infinite;
    }
    @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .logo-stack, .logo-stack img { animation: none !important; }
      .logo-stack img { filter: drop-shadow(0 0 10px rgba(255, 225, 150, 0.55)) drop-shadow(0 0 26px rgba(255, 210, 120, 0.55)) drop-shadow(0 0 60px rgba(255, 185, 80, 0.5)); }
    }
    .logo-stack img {
      display: block; width: 100%; height: auto;
      opacity: 0.6;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      animation: glow 3s ease-in-out infinite alternate;
    }
    /* back face: pre-turned 180deg so the text reads forwards from behind */
    .logo-stack img.back {
      position: absolute; top: 0; left: 0;
      transform: rotateY(180deg);
    }
    @keyframes glow {
      from { filter: drop-shadow(0 0 8px rgba(255, 225, 150, 0.5)) drop-shadow(0 0 22px rgba(255, 210, 120, 0.5)) drop-shadow(0 0 50px rgba(255, 185, 80, 0.45)); }
      to   { filter: drop-shadow(0 0 12px rgba(255, 225, 150, 0.65)) drop-shadow(0 0 30px rgba(255, 210, 120, 0.6)) drop-shadow(0 0 70px rgba(255, 185, 80, 0.55)); }
    }
    .cv-button, .music-button {
      position: fixed; bottom: 24px; z-index: 2;
      font-family: "Times New Roman", Times, serif;
      font-size: 26px; letter-spacing: 2px; line-height: 1;
      display: inline-block;
      transform: scaleY(2.3);           /* tall, narrow letters like the logo */
      transform-origin: left bottom;
      color: #000; text-decoration: none;
      padding: 2px 10px;
      opacity: 0.6;
      text-shadow: 0 0 8px rgba(255, 225, 150, 0.8), 0 0 20px rgba(255, 190, 90, 0.7);
      transition: opacity 0.2s;
    }
    .cv-button:hover, .music-button:hover { opacity: 1; }
    .cv-button { left: 24px; }
    .music-button { right: 24px; transform-origin: right bottom; }
  </style>
</head>
<body>
  <video id="bg" autoplay loop muted playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="logo">
    <div class="drag" id="drag">
      <div class="logo-stack">
        <img src="logo-test.png" alt="Eli Purdy-Flacks" draggable="false">
        <img class="back" src="logo-test.png" alt="" draggable="false">
      </div>
    </div>
  </div>
  <a class="cv-button" href="cv.html">CV</a>
  <a class="music-button" href="https://linktr.ee/purdyflacks" target="_blank" rel="noopener">MUSIC</a>
  <script>
    document.getElementById('bg').play().catch(function () {});

    // drag the logo around
    (function () {
      var el = document.getElementById('drag');
      var x = 0, y = 0, startX, startY, baseX, baseY;
      el.addEventListener('pointerdown', function (e) {
        el.setPointerCapture(e.pointerId);
        el.classList.add('dragging');
        startX = e.clientX; startY = e.clientY; baseX = x; baseY = y;
      });
      el.addEventListener('pointermove', function (e) {
        if (!el.classList.contains('dragging')) return;
        x = baseX + e.clientX - startX;
        y = baseY + e.clientY - startY;
        el.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
      });
      function stop() { el.classList.remove('dragging'); }
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
    })();
  </script>
</body>
</html>
